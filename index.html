      (function () {

        var origConsoleInfo = console.info;

        var isAdErr = function (str) {
          return (
            str.indexOf('Script error') !== -1 ||
            str.indexOf('Cannot set property') !== -1 ||
            str.indexOf('gatekeeper') !== -1 ||
            str.indexOf('ezojs') !== -1 ||

            str.indexOf('Monetization not allowed') !== -1 ||
            str.indexOf('bad response') !== -1 ||

          );
        };

        var formatArgs = function (args) {
          return args.map(function (a) {
            try { return String(a || ''); } catch (e) { return ''; }
          }).join(' ');
        };

        console.error = function () {
          if (isAdErr(formatArgs(Array.prototype.slice.call(arguments)))) return;
          if (origConsoleErr) origConsoleErr.apply(console, arguments);
        };

        console.warn = function () {
          if (isAdErr(formatArgs(Array.prototype.slice.call(arguments)))) return;
          if (origConsoleWarn) origConsoleWarn.apply(console, arguments);
        };

        console.log = function () {
          if (isAdErr(formatArgs(Array.prototype.slice.call(arguments)))) return;
          if (origConsoleLog) origConsoleLog.apply(console, arguments);
        };

        console.info = function () {
          if (isAdErr(formatArgs(Array.prototype.slice.call(arguments)))) return;
          if (origConsoleInfo) origConsoleInfo.apply(console, arguments);
        };

        // Global error handler to catch and suppress third-party cross-origin script errors and fetch property assignment issues
        var handleErr = function (msg, error, evt) {
          var str = String(msg || '') + ' ' + String((error && error.message) || '');
          if (
            !msg ||
            msg === 'Script error.' ||
            msg === 'Script error' ||
            str.indexOf('fetch') !== -1 ||
            isAdErr(str)
          ) {
            return true;
          }
          if (evt && evt.target && (evt.target.tagName === 'SCRIPT' || evt.target.tagName === 'LINK')) {
            return true;
          }
          return false;
        };

        var userOnError = null;
        var customOnError = function (msg, url, line, col, error) {
          if (handleErr(msg, error, null)) {
            return true;
          }
          if (typeof userOnError === 'function') {
            return userOnError.apply(this, arguments);
          }
          return true;
        };

        try {
          Object.defineProperty(window, 'onerror', {
            get: function () {
              return customOnError;
            },
            set: function (fn) {
              if (fn !== customOnError) {

            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          window.onerror = customOnError;
        }

        window.addEventListener(
          'error',
          function (e) {
            if (handleErr(e.message, e.error, e)) {
              if (e.preventDefault) e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              return true;
            }
          },
          true

        window.addEventListener(
          'unhandledrejection',
          function (e) {

            }
          },
          true
        );

          var customFetch = origFetch;

          function getF() {
            return customFetch || origFetch;
          }
          function setF(val) {
            customFetch = val;
          }

          var targets = [window];
          var p = window;
          while (p && (p = Object.getPrototypeOf(p))) {
            targets.push(p);
          }

          for (var i = 0; i < targets.length; i++) {
            var t = targets[i];
            try {
              var desc = Object.getOwnPropertyDescriptor(t, 'fetch');
              if (desc && desc.configurable) {

                  get: getF,
                  set: setF,
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (e1) {}
          }

          try {
            var wDesc = Object.getOwnPropertyDescriptor(window, 'fetch');
            if (!wDesc || (wDesc.configurable && !wDesc.set)) {
              Object.defineProperty(window, 'fetch', {
                get: getF,
                set: setF,
                configurable: true,
                enumerable: true

            }

        } catch (e) {}
